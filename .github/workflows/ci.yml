name: Validate Windows app
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: All tests and frozen app build, verified update ZIP
        shell: pwsh
        run: python build_release.py --app-only
      - name: Upload verified experimental update ZIP (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: experimental-update-${{ github.sha }}
          path: |
            release/PhysicsMathPocket_Update_*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
